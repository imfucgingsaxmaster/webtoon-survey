name: Complete Series Links
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  link:
    concurrency:
      group: webtoon-radar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify linking and retained access restrictions
        run: python -m unittest discover -p 'test*.py' -v
      - name: Connect every due Webtoon title and publish every 50 checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u series_links.py --all --limit 50 --publish
      - name: Coverage summary
        if: always()
        run: |
          python -c "import json; from radar import ROOT; from live_data import load_live_metadata,series_coverage; print(series_coverage(json.loads((ROOT/'catalog_latest.json').read_text()),load_live_metadata()))" >> "$GITHUB_STEP_SUMMARY"
