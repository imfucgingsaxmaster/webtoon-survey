name: Weekly Webtoon Radar
on:
  schedule:
    - cron: '17 0 * * 1' # Monday 09:17 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', '.github/workflows/weekly.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify catalogue, work linking and live updates
        run: |
          python -m py_compile app.py
          python -m unittest discover -p 'test*.py' -v
  analyze:
    needs: validate
    if: github.event_name != 'push'
    concurrency:
      group: webtoon-radar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Korean font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum
      - name: Set one observation boundary for the entire refresh
        run: echo "RADAR_REFRESH_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
      - name: Refresh ongoing catalogue and preserve completed archive
        id: catalogue
        run: python radar.py
      - name: Fill missing publishers without changing completed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python publisher_enrichment.py --batch-size 100 --publish
      - name: Collect public title metrics and genres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish each checkpoint so dashboards do not wait for the full run.
          for batch in $(seq 1 30); do
            python metadata.py --webtoon-limit 200 --series-limit 0 --refresh-since "$RADAR_REFRESH_SINCE"
            python history_index.py
            git add catalog_latest.json history/ metadata_latest.json metadata_history/ history_index.json.gz
            if ! git diff --cached --quiet; then
              git commit -m "data: publish public detail checkpoint"
              git pull --rebase origin main
              git push
            fi
            state=$(python -c "import json; print(json.load(open('metadata_latest.json'))['runs']['webtoon']['state'])")
            if [ "$state" = "complete" ]; then break; fi
          done
          if [ "$state" != "complete" ]; then echo 'Full catalogue detail collection did not complete'; exit 1; fi
      - name: Resolve public Webtoon to Series links
        run: python series_links.py --all --limit 50 --publish --refresh-since "$RADAR_REFRESH_SINCE"
      - name: Refresh other discovered Series titles
        # Linked titles already have fresh metrics; avoid fetching them twice.
        run: python metadata.py --webtoon-limit 0 --refresh-since "$RADAR_REFRESH_SINCE"
      - name: Verify actual observations belong to this refresh
        run: python verify_refresh.py --refresh-since "$RADAR_REFRESH_SINCE"
      - name: Export catalogue and searchable metrics
        if: always() && steps.catalogue.outcome == 'success'
        run: |
          python history_index.py
          python radar.py --offline
          python notion_export.py
      - name: Preserve catalogue history
        if: always() && steps.catalogue.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_latest.json history/
          if [ -f metadata_latest.json ]; then git add metadata_latest.json; fi
          if [ -d metadata_history ]; then git add metadata_history/; fi
          if [ -f history_index.json.gz ]; then git add history_index.json.gz; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update catalogue and public title metrics"
            git pull --rebase origin main
            git push
          fi
      - name: Save Excel, summary and SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-radar-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
      - name: Run summary
        run: |
          echo '### Webtoon Radar public catalogue' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real public metadata only. Research PDFs are not data inputs.' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/summary.json >> "$GITHUB_STEP_SUMMARY"
